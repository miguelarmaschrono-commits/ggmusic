<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - GGmusic</title>
    <link rel="shortcut icon" href="assets/favicon/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="manifest" href="assets/favicon/site.webmanifest">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-[#0f172a] text-white font-sans min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden">

    <!-- Efectos de Luces de Fondo -->
    <div class="absolute top-[-15%] left-[-10%] w-96 h-96 bg-indigo-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-15%] right-[-10%] w-96 h-96 bg-purple-600/20 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- Contenedor Principal (Glassmorphism) -->
    <div class="w-full max-w-md bg-[#1e293b]/70 backdrop-blur-xl rounded-3xl p-8 md:p-10 shadow-[0_8px_32px_rgba(0,0,0,0.5)] border border-gray-700/50 relative z-10">
        
        <!-- Botón para volver al inicio -->
        <a href="index.html" class="absolute top-5 left-5 text-gray-400 hover:text-white bg-gray-800/50 hover:bg-gray-700/50 p-2 rounded-full transition-all duration-200" title="Volver al inicio">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
        </a>

        <!-- Cabecera -->
        <div class="text-center mb-10 mt-6">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-500 tracking-tight mb-2">GGmusic</h1>
            <p class="text-gray-400 text-sm font-medium">Bienvenido de vuelta a la movida local</p>
        </div>

        <!-- Alertas -->
        <div id="alerta-login" class="hidden mb-6 p-3.5 rounded-xl text-sm text-center border"></div>

        <!-- Formulario -->
        <form id="form-login" class="space-y-6">
            
            <div class="space-y-1.5">
                <label class="block text-xs font-semibold text-gray-400 tracking-wide uppercase">Correo Electrónico</label>
                <input type="email" id="log-email" placeholder="tu@correo.com" class="w-full bg-gray-900/60 border border-gray-700/50 rounded-xl p-3.5 text-white placeholder-gray-500 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 focus:outline-none transition-all shadow-inner" required>
            </div>
            
            <div class="space-y-1.5">
                <label class="block text-xs font-semibold text-gray-400 tracking-wide uppercase">Contraseña</label>
                <input type="password" id="log-password" placeholder="••••••••" class="w-full bg-gray-900/60 border border-gray-700/50 rounded-xl p-3.5 text-white placeholder-gray-500 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 focus:outline-none transition-all shadow-inner" required>
            </div>

            <button type="submit" id="btn-login" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-3.5 px-4 rounded-xl transition-all duration-300 shadow-[0_0_20px_rgba(79,70,229,0.3)] hover:shadow-[0_0_25px_rgba(79,70,229,0.5)] mt-4 transform hover:-translate-y-0.5">
                Entrar al Panel
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-gray-700/50 text-center">
            <p class="text-gray-400 text-sm">
                ¿No tienes cuenta? <a href="registro.html" class="text-indigo-400 hover:text-purple-400 font-bold transition-colors">Regístrate aquí</a>
            </p>
        </div>
    </div>

   <script type="module" src="js/login.js"></script>
</body>
</html>
