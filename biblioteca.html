<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Biblioteca - GGmusic</title>

    <link rel="shortcut icon" href="assets/favicon/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="manifest" href="assets/favicon/site.webmanifest">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/main.css"> 

    <style>
        /* Estilos fluidos para el cambio de estado activo en los botones de filtro */
        .tab-btn {
            background-color: rgba(30, 41, 59, 0.7);
            color: #94a3b8;
            border: 1px solid rgba(51, 65, 85, 0.5);
            transition: all 0.2s ease-in-out;
        }
        .tab-btn:hover {
            color: #ffffff;
            background-color: rgba(51, 65, 85, 0.8);
        }
        .tab-btn.active {
            background-color: #059669 !important;
            color: #ffffff !important;
            border-color: #10b981 !important;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.3);
        }
        .tab-btn.active .badge-count {
            background-color: rgba(0, 0, 0, 0.25) !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-emerald-500 selection:text-white">

    <header id="main-nav" class="sticky top-0 z-50 backdrop-blur-xl bg-slate-950/80 border-b border-slate-800/60">
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
        
        <!-- BOTÓN DE RETROCEDER ESTILIZADO -->
        <div class="flex items-center">
            <a href="index.html" class="inline-flex items-center gap-2 bg-slate-800/60 hover:bg-slate-700/80 text-white px-5 py-2.5 rounded-full text-sm font-bold backdrop-blur-md border border-slate-700/50 transition-all shadow-lg group w-fit">
                <svg class="w-5 h-5 group-hover:-translate-x-1 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Volver al inicio
            </a>
        </div>
        
        <section class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-emerald-950/40 via-slate-900 to-slate-900 border border-slate-800/80 p-8 md:p-10 shadow-2xl">
            <div class="absolute -top-24 -left-24 w-72 h-72 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-24 -right-24 w-72 h-72 bg-purple-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="relative z-10 space-y-3">
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold uppercase tracking-wider">
                    <span>📚 Colección Personal</span>
                </div>
                <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">Mi Biblioteca</h1>
                <p class="text-slate-400 text-base sm:text-lg max-w-2xl">
                    Tus artistas y productores favoritos guardados en un solo lugar.
                </p>
            </div>
        </section>

        <section class="flex flex-col md:flex-row gap-4 items-center justify-between bg-slate-900/60 p-4 rounded-2xl border border-slate-800/80 backdrop-blur-md">
            
            <div class="relative w-full md:w-80">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <input type="text" id="searchInput" placeholder="Buscar en tus favoritos..." class="w-full pl-10 pr-4 py-2.5 bg-slate-950/70 border border-slate-800 rounded-xl text-slate-200 placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition duration-200">
            </div>

            <div class="flex items-center gap-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0" id="filter-tabs">
                <button class="tab-btn active px-4 py-2 rounded-xl text-sm font-medium flex items-center gap-2 whitespace-nowrap" data-filter="all">
                    <span>Todo</span>
                    <span id="count-all" class="badge-count px-2 py-0.5 text-xs rounded-full bg-slate-700/60 text-slate-300 font-bold">0</span>
                </button>

                <button class="tab-btn px-4 py-2 rounded-xl text-sm font-medium flex items-center gap-2 whitespace-nowrap" data-filter="artist">
                    <span>Artistas</span>
                    <span id="count-artistas" class="badge-count px-2 py-0.5 text-xs rounded-full bg-slate-700/60 text-slate-300 font-semibold">0</span>
                </button>

                <button class="tab-btn px-4 py-2 rounded-xl text-sm font-medium flex items-center gap-2 whitespace-nowrap" data-filter="producer">
                    <span>Productores</span>
                    <span id="count-productores" class="badge-count px-2 py-0.5 text-xs rounded-full bg-slate-700/60 text-slate-300 font-semibold">0</span>
                </button>
            </div>

        </section>

        <section aria-label="Mis Favoritos">
            <div id="profiles-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                
                <div class="col-span-full py-20 flex flex-col items-center justify-center text-center space-y-4">
                    <div class="relative w-12 h-12">
                        <div class="absolute inset-0 rounded-full border-4 border-emerald-500/20"></div>
                        <div class="absolute inset-0 rounded-full border-4 border-emerald-500 border-t-transparent animate-spin"></div>
                    </div>
                    <p class="text-slate-400 font-medium text-sm animate-pulse">Cargando tu biblioteca personal...</p>
                </div>

            </div>
        </section>

    </main>

    <script type="module" src="js/ui/session-nav.js"></script>
    <script type="module" src="js/ui/auth-guard.js"></script> 
    <script type="module" src="js/ui/render.js"></script>
    <script type="module" src="js/biblioteca.js"></script>
</body>
</html>
