<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Productor | GGmusic</title>
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="assets/favicon/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="manifest" href="assets/favicon/site.webmanifest">
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#090d16',
                        card: '#0f172a'
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
</head>
<body class="bg-dark text-slate-200 font-sans min-h-screen pb-20 antialiased selection:bg-emerald-500 selection:text-white">

    <!-- Top Nav Flotante -->
    <nav class="fixed top-0 left-0 right-0 z-50 p-4 md:p-6 flex justify-between items-center bg-gradient-to-b from-black/90 via-black/40 to-transparent pointer-events-none backdrop-blur-[2px]">
        <a href="explorar-productores.html" class="pointer-events-auto bg-slate-900/80 hover:bg-slate-800 text-white p-3 rounded-full border border-slate-700/50 backdrop-blur-md transition-all shadow-xl hover:scale-105 active:scale-95 flex items-center justify-center group" aria-label="Volver">
            <svg class="w-5 h-5 group-hover:-translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
        </a>
        <button id="btn-compartir" class="pointer-events-auto bg-slate-900/80 hover:bg-slate-800 text-white p-3 rounded-full border border-slate-700/50 backdrop-blur-md transition-all shadow-xl hover:scale-105 active:scale-95 flex items-center justify-center group" aria-label="Compartir perfil">
            <svg class="w-5 h-5 group-hover:rotate-12 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
        </button>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-grow">
        <!-- Banner Superior Dinámico -->
        <div class="h-56 md:h-72 w-full relative overflow-hidden bg-dark">
            <div id="productor-hero-bg" class="absolute inset-0 bg-cover bg-center bg-no-repeat filter brightness-75 blur-md scale-110 opacity-50 transition-all duration-700"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-dark via-dark/70 to-emerald-950/20"></div>
            <div class="absolute inset-0 bg-emerald-500/5 mix-blend-overlay"></div>
        </div>

        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 -mt-28 relative z-10 pb-12">
            
            <div class="bg-card/90 border border-slate-800/80 rounded-3xl shadow-2xl p-6 sm:p-10 backdrop-blur-xl relative overflow-hidden">
                <!-- Resplandor decorativo de fondo -->
                <div class="absolute -top-20 -right-20 w-64 h-64 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

                <!-- Cabecera del Perfil -->
                <div class="flex flex-col sm:flex-row gap-8 items-start sm:items-center mb-10 relative z-10">
                    <!-- Foto de Perfil -->
                    <div class="shrink-0 relative">
                        <img id="productor-foto" src="https://ui-avatars.com/api/?name=Productor&background=10b981&color=fff&size=150" alt="Foto Productor" class="w-32 h-32 sm:w-40 sm:h-40 rounded-3xl object-cover border-2 border-emerald-500/30 shadow-2xl ring-8 ring-black/40">
                        <span id="badge-verificado" class="hidden absolute -bottom-1 -right-1 bg-emerald-500 text-slate-950 text-xs p-2 rounded-full border-2 border-card shadow-lg font-bold" title="Productor Verificado">
                            <i class="fas fa-check"></i>
                        </span>
                    </div>

                    <!-- Info Principal -->
                    <div class="flex-grow space-y-3">
                        <div class="flex flex-wrap items-center gap-3">
                            <h1 id="productor-nombre" class="text-3xl sm:text-5xl font-black text-white tracking-tight">Cargando...</h1>
                        </div>
                        
                        <div class="flex flex-wrap items-center gap-3 text-xs sm:text-sm font-semibold text-slate-400">
                            <span class="flex items-center gap-2 bg-slate-800/60 border border-slate-700/60 px-3 py-1.5 rounded-full backdrop-blur-md">
                                <i class="fas fa-sliders-h text-emerald-400"></i>
                                <span id="productor-especialidad" class="text-slate-200">Especialidad</span>
                            </span>
                            <span class="flex items-center gap-2 bg-slate-800/60 border border-slate-700/60 px-3 py-1.5 rounded-full backdrop-blur-md">
                                <i class="fas fa-map-marker-alt text-emerald-400"></i>
                                <span id="productor-zona" class="text-slate-200">Guarenas / Guatire</span>
                            </span>
                            <span class="flex items-center gap-2 bg-slate-800/60 border border-slate-700/60 px-3 py-1.5 rounded-full backdrop-blur-md">
                                <i class="fas fa-music text-emerald-400"></i>
                                <span id="productor-trabajos-count" class="text-slate-200">0 Trabajos</span>
                            </span>
                        </div>

                        <!-- Seguir y Estadísticas -->
                        <div class="flex items-center gap-4 pt-2">
                            <button id="btn-seguir" class="px-7 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold text-sm shadow-lg shadow-emerald-600/30 border border-emerald-400/20 transition-all">
                                Seguir
                            </button>
                            <div class="text-slate-400 text-sm bg-slate-800/40 px-4 py-2 rounded-xl border border-slate-800">
                                <span id="contador-seguidores" class="text-white font-extrabold text-base">0</span> <span class="text-slate-400 font-medium">Seguidores</span>
                            </div>
                        </div>

                        <!-- Redes Sociales -->
                        <div class="flex flex-wrap gap-2.5 pt-2" id="contenedor-redes">
                            <a href="#" id="btn-instagram" target="_blank" rel="noopener noreferrer" class="hidden bg-slate-800/80 hover:bg-slate-700/80 text-white border border-slate-700/60 px-4 py-2 rounded-xl text-xs font-semibold transition-all flex items-center gap-2">
                                <i class="fab fa-instagram text-emerald-400 text-sm"></i> Instagram
                            </a>
                            <a href="#" id="btn-tiktok" target="_blank" rel="noopener noreferrer" class="hidden bg-slate-800/80 hover:bg-slate-700/80 text-white border border-slate-700/60 px-4 py-2 rounded-xl text-xs font-semibold transition-all flex items-center gap-2">
                                <i class="fab fa-tiktok text-emerald-400 text-sm"></i> TikTok
                            </a>
                            <a href="#" id="btn-beats" target="_blank" rel="noopener noreferrer" class="hidden bg-slate-800/80 hover:bg-slate-700/80 text-white border border-slate-700/60 px-4 py-2 rounded-xl text-xs font-semibold transition-all flex items-center gap-2">
                                <i class="fas fa-music text-emerald-400 text-sm"></i> Beats / Portafolio
                            </a>
                            <a href="#" id="btn-youtube" target="_blank" rel="noopener noreferrer" class="hidden bg-slate-800/80 hover:bg-slate-700/80 text-white border border-slate-700/60 px-4 py-2 rounded-xl text-xs font-semibold transition-all flex items-center gap-2">
                                <i class="fab fa-youtube text-emerald-400 text-sm"></i> YouTube
                            </a>
                            <a href="#" id="btn-whatsapp" target="_blank" rel="noopener noreferrer" class="hidden bg-slate-800/80 hover:bg-slate-700/80 text-white border border-slate-700/60 px-4 py-2 rounded-xl text-xs font-semibold transition-all flex items-center gap-2">
                                <i class="fab fa-whatsapp text-emerald-400 text-sm"></i> WhatsApp
                            </a>
                        </div>
                    </div>
                </div>

                <hr class="border-slate-800/80 my-8">

                <!-- Columnas: Biografía, Beats y Detalles Técnicos -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 relative z-10">
                    
                    <!-- Columna Principal -->
                    <div class="lg:col-span-2 space-y-8">
                        <!-- Sobre el Productor -->
                        <div>
                            <h2 class="text-xl font-extrabold text-white mb-4 flex items-center gap-3">
                                <span class="p-2 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded-xl text-base">🎧</span>
                                Sobre el Productor
                            </h2>
                            <div class="bg-dark/60 rounded-2xl p-6 border border-slate-800/80">
                                <p id="productor-bio" class="text-slate-300 leading-relaxed text-sm md:text-base whitespace-pre-line">
                                    Cargando biografía del productor...
                                </p>
                            </div>
                        </div>

                        <!-- Portafolio y Beats -->
                        <div>
                            <div class="flex items-center justify-between mb-4">
                                <h2 class="text-xl font-extrabold text-white flex items-center gap-3">
                                    <span class="p-2 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded-xl text-base">🎹</span>
                                    Portafolio / Beats
                                </h2>
                                <span id="badge-total-trabajos" class="text-xs font-extrabold text-emerald-300 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full"></span>
                            </div>
                            <div id="productor-portafolio" class="bg-dark/60 border border-slate-800/80 rounded-2xl p-8 text-center text-slate-400 font-medium text-sm">
                                Cargando portafolio...
                            </div>
                        </div>
                    </div>

                    <!-- Columna Derecha: Servicios y Hardware/DAW -->
                    <div class="space-y-6">
                        <!-- Servicios -->
                        <div class="bg-dark/60 border border-slate-800/80 rounded-2xl p-6">
                            <h3 class="text-base font-extrabold text-white mb-4 border-b border-slate-800/80 pb-3 flex items-center gap-2">
                                <i class="fas fa-concierge-bell text-emerald-400"></i> Servicios Ofrecidos
                            </h3>
                            <ul id="productor-servicios" class="space-y-2.5 text-xs md:text-sm text-slate-300">
                                <li class="text-slate-500">Cargando...</li>
                            </ul>
                        </div>
                        
                        <!-- DAW Principal -->
                        <div class="bg-dark/60 border border-slate-800/80 rounded-2xl p-6">
                            <h3 class="text-base font-extrabold text-white mb-4 border-b border-slate-800/80 pb-3 flex items-center gap-2">
                                <i class="fas fa-laptop-code text-emerald-400"></i> DAW Principal
                            </h3>
                            <div class="flex items-center gap-3.5 bg-slate-900/80 p-3.5 rounded-xl border border-slate-800">
                                <div class="bg-emerald-500/10 border border-emerald-500/20 p-2.5 rounded-lg text-emerald-400">
                                    <i class="fas fa-sliders text-lg"></i>
                                </div>
                                <span id="productor-daw" class="text-slate-200 font-semibold text-sm">Cargando...</span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Toast de Notificaciones -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 bg-emerald-600 text-white px-5 py-3.5 rounded-2xl shadow-2xl shadow-emerald-600/30 border border-emerald-400/30 text-xs font-bold transform translate-y-20 opacity-0 transition-all duration-300 backdrop-blur-md">
        <span id="toast-mensaje"></span>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/productor.js"></script>
</body>
</html>
